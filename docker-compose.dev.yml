# Development stack: Router + nginx + PostgreSQL.
#   cp .env.example .env
#   docker compose -f docker-compose.dev.yml up -d --build
# Admin: http://localhost:8080/admin/   Routing API: http://localhost:8080/routing/...

name: labmango-router-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-router}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-router}
      POSTGRES_DB: ${POSTGRES_DB:-router}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  router:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-router}:${POSTGRES_PASSWORD:-router}@postgres:5432/${POSTGRES_DB:-router}
      LISTEN_ADDR: 0.0.0.0:8000
      NGINX_MAP_FILE: /nginx-tenants/backends.map
      NGINX_ADMIN_DIR: /nginx-admin
      NGINX_INTERNAL_BASE_URL: http://nginx:8080
    volumes:
      - ./deploy/nginx/dev/tenants:/nginx-tenants:ro
      - nginx_admin:/nginx-admin
      # Per-backend sync tokens (ROUTING_SYNC_TOKENS_DIR=/run/secrets/sync-tokens):
      # - ./secrets/sync-tokens:/run/secrets/sync-tokens:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    command: ["sh", "/etc/nginx/watch-maps.sh"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/dev/tenants:/etc/nginx/tenants:ro
      - ./deploy/nginx/watch-maps.sh:/etc/nginx/watch-maps.sh:ro
      - ./deploy/certs:/etc/nginx/ca:ro
      - nginx_admin:/etc/nginx/tenants-admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - router

volumes:
  pgdata:
  nginx_admin:
