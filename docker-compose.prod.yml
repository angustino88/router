# Production stack: Router + nginx (HTTPS). PostgreSQL runs outside (DATABASE_URL in .env).
#   docker compose -f docker-compose.prod.yml up -d --build
# Several Router replicas are safe (--scale router=2): only the leader syncs.

name: labmango-router

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  router:
    build:
      context: .
      args:
        VERSION: ${ROUTER_VERSION:-dev}
    image: labmango-router:${ROUTER_VERSION:-latest}
    env_file: .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8000
      NGINX_MAP_FILE: /nginx-tenants/backends.map
      NGINX_ADMIN_DIR: /nginx-admin
      NGINX_INTERNAL_BASE_URL: http://nginx:8080
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - ./deploy/nginx/prod/tenants:/nginx-tenants:ro
      - nginx_admin:/nginx-admin
      # Per-backend sync tokens (ROUTING_SYNC_TOKENS_DIR=/run/secrets/sync-tokens), files mode 0400:
      # - ./secrets/sync-tokens:/run/secrets/sync-tokens:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *logging
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    command: ["sh", "/etc/nginx/watch-maps.sh"]
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env (the frontend origin)}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/prod/tenants:/etc/nginx/tenants:ro
      - ./deploy/nginx/watch-maps.sh:/etc/nginx/watch-maps.sh:ro
      - ./deploy/certs:/etc/nginx/ca:ro
      - ./ssl_certificates:/etc/nginx/ssl:ro
      - nginx_admin:/etc/nginx/tenants-admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    depends_on:
      router:
        condition: service_healthy
    logging: *logging
    restart: unless-stopped

volumes:
  nginx_admin:
