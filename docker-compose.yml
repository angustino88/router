# Local / dev: Router + nginx (+ optional PostgreSQL).
#   cp .env.example .env      # then edit
#   docker compose --profile db up -d --build         # with the bundled PostgreSQL
#   docker compose up -d --build                      # PostgreSQL elsewhere (DATABASE_URL in .env)
# Admin: http://localhost:8080/admin/   Routing API: http://localhost:8080/routing/...

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenant}
      POSTGRES_DB: ${POSTGRES_DB:-tenant_resolver}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tenant_resolver:
    build: .
    container_name: tenant_resolver
    env_file: .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8000
      NGINX_MAP_FILE: /nginx-tenants/backends.map
      NGINX_ADMIN_DIR: /nginx-admin
      NGINX_INTERNAL_BASE_URL: ${NGINX_INTERNAL_BASE_URL:-http://nginx:8080}
    volumes:
      - ./deploy/nginx/local/tenants:/nginx-tenants:ro    # static backends.map (read-only, normally empty)
      - nginx_admin:/nginx-admin                          # generated map, shared with nginx
      # Per-backend sync tokens (ROUTING_SYNC_TOKENS_DIR=/run/secrets/sync-tokens):
      # - ./secrets/sync-tokens:/run/secrets/sync-tokens:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    command: ["sh", "/etc/nginx/watch-maps.sh"]           # nginx + auto reload when a map changes
    environment:
      # Browser origins of the frontend (comma separated).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${HOST_PORT:-8080}:80"                           # public listener; 8080 inside is the internal sync listener
    volumes:
      - ./deploy/nginx/local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/local/tenants:/etc/nginx/tenants:ro
      - ./deploy/nginx/watch-maps.sh:/etc/nginx/watch-maps.sh:ro
      - ./deploy/certs:/etc/nginx/ca:ro
      - nginx_admin:/etc/nginx/tenants-admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tenant_resolver
    restart: unless-stopped

volumes:
  pgdata:
  nginx_admin:
