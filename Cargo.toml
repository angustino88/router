[package]
name = "tenant-resolver"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "LabMango Router: routes users and agents to their department backend (Rust port of the Django tenant_resolver_service)"

[[bin]]
name = "tenant-resolver"
path = "src/main.rs"

[dependencies]
# Local copy of the Rust port of drf-api-contracts (OpenAPI contracts). Used for documentation only.
api-contracts = { path = "api-contracts-rs/api-contracts" }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
