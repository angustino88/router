[workspace]
members = [".", "crates/api-contracts"]
resolver = "2"

[package]
name = "labmango-router"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "LabMango Router: routes users and agents to their department backend"
publish = false

[[bin]]
# Binary name kept for existing deployments, scripts and docs.
name = "tenant-resolver"
path = "src/main.rs"

[dependencies]
api-contracts = { path = "crates/api-contracts" }
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "set-header", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = "5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
