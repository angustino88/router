# Production: Router + nginx (HTTPS). PostgreSQL runs on its own server (DATABASE_URL in .env).
#   docker compose -f docker-compose.production.yml up -d --build
# Backends are managed on /admin/ (URL per backend); nginx reloads itself when the generated map changes.
# For availability, run several Router replicas (--scale tenant_resolver=2): only the leader syncs.

services:
  tenant_resolver:
    build: .
    env_file: .env
    environment:
      LISTEN_ADDR: 0.0.0.0:8000
      NGINX_MAP_FILE: /nginx-tenants/backends.map
      NGINX_ADMIN_DIR: /nginx-admin
      NGINX_INTERNAL_BASE_URL: ${NGINX_INTERNAL_BASE_URL:-http://nginx:8080}
    volumes:
      - ./deploy/nginx/production/tenants:/nginx-tenants:ro
      - nginx_admin:/nginx-admin
      # Per-backend sync tokens (ROUTING_SYNC_TOKENS_DIR=/run/secrets/sync-tokens), files mode 0400:
      # - ./secrets/sync-tokens:/run/secrets/sync-tokens:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    command: ["sh", "/etc/nginx/watch-maps.sh"]
    environment:
      # Browser origins of the frontend (comma separated), e.g. https://labmango.example.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env (the frontend origin)}
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/production/tenants:/etc/nginx/tenants:ro
      - ./deploy/nginx/watch-maps.sh:/etc/nginx/watch-maps.sh:ro
      - ./deploy/certs:/etc/nginx/ca:ro
      - ./ssl_certificates:/etc/nginx/ssl:ro
      - nginx_admin:/etc/nginx/tenants-admin
    depends_on:
      - tenant_resolver
    restart: unless-stopped

volumes:
  nginx_admin:
