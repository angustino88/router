# ==========================================
# Generic proxy for every backend declared in the backend maps.
# Do not add per-backend location files: set the backend URL on /admin/ (or add a line to backends.map).
# ==========================================

location ~ ^/t/(?<tenant_id>[^/]+)$ {
    return 308 $uri/;
}

location ~ ^/t/(?<tenant_id>[^/]+)/ {
    # prefix_key not routed
    if ($tenant_backend = "") {
        return 404;
    }

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers $http_access_control_request_headers;
        add_header Access-Control-Max-Age 600;
        add_header Vary Origin;
        return 204;
    }

    # Strip "/t/{prefix_key}", query string is kept
    rewrite ^/t/[^/]+/(.*)$ /$1 break;

    # $tenant_backend is a full URL (scheme://host:port), see the maps in nginx.conf.
    # Variable in proxy_pass -> resolved per request through "resolver".
    proxy_pass $tenant_backend;

    proxy_set_header Host $tenant_backend_hostport;
    proxy_ssl_server_name on;
    proxy_ssl_name $tenant_backend_host;

    # Cookies set by a backend are scoped to its prefix, so two backends never overwrite each other's cookies.
    proxy_cookie_path / /t/$tenant_id/;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # If a backend redirects internal (http) calls to https, use: X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Public path prefix of the backend behind the Router (informational; Django ignores it by default).
    proxy_set_header X-Forwarded-Prefix /t/$tenant_id;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
