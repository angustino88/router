map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Browser origins allowed to call the Router and the backends behind it (the frontend).
# Generated at start-up by watch-maps.sh from CORS_ALLOWED_ORIGINS (docker-compose / .env).
map $http_origin $cors_origin {
    default "";
    include /etc/nginx/generated/cors_origins.map;
}

# Tenant backends: prefix_key -> backend.
#   tenants-admin/backends.admin.map : generated by the Router from the backend URLs on /admin/ (main source)
#   tenants/backends.map             : optional static entries, normally empty
# A value is either "host:port" (scheme https:// is added) or a full URL "https://host:port".
map $tenant_id $tenant_backend_raw {
    default "";
    include /etc/nginx/tenants/backends.map;
    include /etc/nginx/tenants-admin/*.map;
}

# Normalised to "scheme://host:port".
map $tenant_backend_raw $tenant_backend {
    ""             "";
    ~^https?://    $tenant_backend_raw;
    default        https://$tenant_backend_raw;
}

# "host:port" (Host header) and "host" (TLS SNI) of the backend.
map $tenant_backend $tenant_backend_hostport {
    default              "";
    ~^https?://([^/]+)   $1;
}
map $tenant_backend_hostport $tenant_backend_host {
    default       "";
    ~^([^:]+)     $1;
}

# Plain HTTP on the public domain -> HTTPS. Replace another-host.com with your public domain.
server {
    listen 80;
    server_name another-host.com;
    return 301 https://$host$request_uri;
}

# Public server (frontend, users, agents).
# default_server: requests whose Host matches no server_name land here instead of the redirect block above.
# Note: "server_name _" alone is NOT a catch-all.
server {
    listen 443 ssl default_server;
    listen 80 default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/another-host.com.pem;
    ssl_certificate_key /etc/nginx/ssl/another-host.com.key;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    client_max_body_size 20M;

    # Docker embedded DNS, required because proxy_pass uses variables
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $tenant_svc tenant_resolver:8000;

    # CORS is answered by nginx for every location below; the backends' own CORS headers are hidden so a
    # browser never sees them twice.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /routing {
        return 308 /routing/;
    }

    # Public routing API of the Router: /routing/... -> /api/v1/routing/...
    location /routing/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 600;
            add_header Vary Origin;
            return 204;
        }

        rewrite ^/routing/(.*)$ /api/v1/routing/$1 break;
        proxy_pass http://$tenant_svc;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The backends' routing sync API (/internal/*) and the legacy sync endpoints are private (backend spec
    # AUTH-6): never reachable from the public listener. The Router reaches them through port 8080 below.
    # Must stay above the tenants include (regex locations match in order).
    location ~* ^/t/[^/]+/(internal(/|$)|api/(tenant-sync/|labs/tenant-sync/|agents/key-encryption)) {
        return 404;
    }

    # ==========================================
    # Generic proxy for /t/{prefix_key}/... (users, frontend API calls, websockets, agents)
    # ==========================================
    include /etc/nginx/tenants/*.conf;

    # /admin/, /openapi.json and anything else: the Router service.
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 600;
            add_header Vary Origin;
            return 204;
        }

        proxy_pass http://$tenant_svc;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ==========================================
# Internal-only entrypoint: Router -> backends' routing sync API.
# Port 8080 is NOT published in docker-compose, so only containers on the same Docker network can reach it.
# Use it with NGINX_INTERNAL_BASE_URL=http://nginx:8080.
# Only GET /t/<prefix_key>/internal/... is proxied (backend spec GET-1, enforced here and by the backend);
# the backend's certificate is verified (AUTH-4) against the system CAs plus deploy/certs/*.crt.
# ==========================================
server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/internal.access.log;
    error_log /var/log/nginx/internal.error.log;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/t/(?<tenant_id>[^/]+)/internal/ {
        if ($tenant_backend = "") {
            return 404;
        }
        limit_except GET {
            deny all;
        }

        rewrite ^/t/[^/]+/(.*)$ /$1 break;
        proxy_pass $tenant_backend;

        proxy_set_header Host $tenant_backend_hostport;
        proxy_ssl_server_name on;
        proxy_ssl_name $tenant_backend_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/nginx/generated/ca-bundle.crt;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        # Long-polls are held up to 30 s by the backend (spec 8.8: at least wait + 5 s).
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
