# Generic proxy for every backend declared in the backend maps (generated from /admin/, or backends.map).

location ~ ^/t/(?<tenant_id>[^/]+)$ {
    return 308 $uri/;
}

location ~ ^/t/(?<tenant_id>[^/]+)/ {
    if ($tenant_backend = "") {
        return 404;
    }

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_origin;
        add_header Access-Control-Allow-Credentials "true";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers $http_access_control_request_headers;
        add_header Access-Control-Max-Age 600;
        add_header Vary Origin;
        return 204;
    }

    rewrite ^/t/[^/]+/(.*)$ /$1 break;
    # $tenant_backend is a full URL (scheme://host:port), see the maps in nginx.conf.
    proxy_pass $tenant_backend;

    # Local backends usually run on the host machine: Django's ALLOWED_HOSTS then only needs host.docker.internal.
    proxy_set_header Host host.docker.internal;
    # Cookies set by a backend are scoped to its prefix.
    proxy_cookie_path / /t/$tenant_id/;
    proxy_set_header X-Forwarded-Prefix /t/$tenant_id;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
