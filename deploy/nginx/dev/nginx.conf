server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Browser origins allowed to call the Router and the backends behind it (the frontend dev server).
# Generated at start-up by watch-maps.sh from CORS_ALLOWED_ORIGINS (default http://localhost:3000).
map $http_origin $cors_origin {
    default "";
    include /etc/nginx/generated/cors_origins.map;
}

# Tenant backends: prefix_key -> backend.
#   tenants-admin/backends.admin.map : generated by the Router from the backend URLs on /admin/ (main source)
#   tenants/backends.map             : optional static entries, normally empty
# A value is either "host:port" (scheme http:// is added) or a full URL "https://host:port".
map $tenant_id $tenant_backend_raw {
    default "";
    include /etc/nginx/tenants/backends.map;
    include /etc/nginx/tenants-admin/*.map;
}

# Normalised to "scheme://host:port".
map $tenant_backend_raw $tenant_backend {
    ""             "";
    ~^https?://    $tenant_backend_raw;
    default        http://$tenant_backend_raw;
}

# "host:port" (Host header) and "host" (TLS SNI) of the backend.
map $tenant_backend $tenant_backend_hostport {
    default              "";
    ~^https?://([^/]+)   $1;
}
map $tenant_backend_hostport $tenant_backend_host {
    default       "";
    ~^([^:]+)     $1;
}

# Public server: http://localhost:${HOST_PORT:-8080}
server {
    listen 80 default_server;
    server_name localhost _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 20M;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Operational endpoint of the Router service: scrape router:8000 directly.
    location = /metrics {
        return 404;
    }

    location = /routing {
        return 308 /routing/;
    }

    location /routing/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 600;
            add_header Vary Origin;
            return 204;
        }

        set $routing_svc router:8000;
        rewrite ^/routing/(.*)$ /api/v1/routing/$1 break;
        proxy_pass http://$routing_svc;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The backends' routing sync API is private (backend spec AUTH-6); the Router uses port 8080 below.
    location ~* ^/t/[^/]+/internal(/|$) {
        return 404;
    }

    include /etc/nginx/tenants/_proxy.conf;

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin;
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers $http_access_control_request_headers;
            add_header Access-Control-Max-Age 600;
            add_header Vary Origin;
            return 204;
        }

        set $tenant_svc router:8000;
        proxy_pass http://$tenant_svc;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Internal-only entrypoint (not published): Router -> GET /t/<prefix_key>/internal/... on the backends.
# NGINX_INTERNAL_BASE_URL=http://nginx:8080
server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/t/(?<tenant_id>[^/]+)/internal/ {
        if ($tenant_backend = "") {
            return 404;
        }
        limit_except GET {
            deny all;
        }

        rewrite ^/t/[^/]+/(.*)$ /$1 break;
        proxy_pass $tenant_backend;

        # Same Host as the public proxy (_proxy.conf), so one ALLOWED_HOSTS entry covers both.
        proxy_set_header Host host.docker.internal;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
