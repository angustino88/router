# Production nginx: HTTPS, backends default to https://.
# Replace router.example.com with the public host name; the certificate is ssl_certificates/server.{pem,key}.

server_tokens off;

gzip on;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 1024;

map "" $backend_default_scheme { default https; }
include /etc/nginx/labmango/snippets/maps.conf;

server {
    listen 80;
    server_name router.example.com;
    return 301 https://$host$request_uri;
}

# default_server: requests whose Host matches no server_name land here (e.g. the container health check).
server {
    listen 443 ssl default_server;
    listen 80 default_server;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.pem;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $router_upstream router:8000;

    client_max_body_size 20M;

    # nginx answers CORS; the backends' own CORS headers are hidden so a browser never sees them twice.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Vary Origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    include /etc/nginx/labmango/snippets/public-locations.conf;
}

include /etc/nginx/labmango/snippets/internal-server.conf;
