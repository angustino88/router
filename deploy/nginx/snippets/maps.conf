# Maps shared by both environments. Included at http level, after $backend_default_scheme is defined.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Browser origins allowed to call the Router and the backends behind it (the frontend).
# Written at start-up by entrypoint.sh from CORS_ALLOWED_ORIGINS.
map $http_origin $cors_origin {
    default "";
    include /etc/nginx/generated/cors_origins.map;
}

# prefix_key -> backend, from the map the Router writes into the shared volume.
# A value is "scheme://host:port", or "host:port" with the environment's default scheme.
map $prefix_key $backend_raw {
    default "";
    include /etc/nginx/router/*.map;
}

map $backend_raw $backend_url {
    ""             "";
    ~^https?://    $backend_raw;
    default        $backend_default_scheme://$backend_raw;
}

# "host:port" (Host header) and "host" (TLS SNI) of the backend.
map $backend_url $backend_hostport {
    default              "";
    ~^https?://([^/]+)   $1;
}
map $backend_hostport $backend_host {
    default       "";
    ~^([^:]+)     $1;
}
