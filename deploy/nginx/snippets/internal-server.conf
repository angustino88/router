# Internal listener (port 8080, never published): Router -> GET /t/<prefix_key>/internal/... on the backends.
# Only GET is proxied (backend spec GET-1); long-polls are held up to 30 s (spec 8.8: timeout >= wait + 5 s).
# Backend certificates are verified for https upstreams.
server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/t/(?<prefix_key>[^/]+)/internal/ {
        if ($backend_url = "") {
            return 404;
        }
        limit_except GET {
            deny all;
        }

        rewrite ^/t/[^/]+/(.*)$ /$1 break;
        proxy_pass $backend_url;

        proxy_set_header Host $backend_hostport;
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;
        # Verify the backend certificate (AUTH-4): system CAs plus deploy/certs/*.crt (entrypoint.sh).
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/nginx/generated/ca-bundle.crt;

        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
