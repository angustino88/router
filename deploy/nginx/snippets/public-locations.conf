# Locations of the public listener, shared by both environments.

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Operational endpoint of the Router service: scrape router:8000 from the internal network.
location = /metrics {
    return 404;
}

# The backends' routing sync API is private (backend spec AUTH-6); the Router reaches it on port 8080.
location ~ ^/t/[^/]+/internal(/|$) {
    return 404;
}

location ~ ^/t/(?<prefix_key>[^/]+)$ {
    return 308 $uri/;
}

# Backend traffic: /t/<prefix_key>/<path> -> <backend_url>/<path> (API, WebSockets, agents).
location ~ ^/t/(?<prefix_key>[^/]+)/ {
    if ($backend_url = "") {
        return 404;
    }
    if ($request_method = OPTIONS) {
        include /etc/nginx/labmango/snippets/cors-preflight.conf;
    }

    rewrite ^/t/[^/]+/(.*)$ /$1 break;
    proxy_pass $backend_url;

    proxy_set_header Host $backend_hostport;
    proxy_ssl_server_name on;
    proxy_ssl_name $backend_host;

    # Cookies set by a backend are scoped to its prefix, so backends never overwrite each other's cookies.
    proxy_cookie_path / /t/$prefix_key/;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /t/$prefix_key;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Everything else (/routing/..., /admin/..., /openapi.json): the Router service.
location / {
    if ($request_method = OPTIONS) {
        include /etc/nginx/labmango/snippets/cors-preflight.conf;
    }
    proxy_pass http://$router_upstream;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}
